version: '3.9'

services:
  # ── .NET API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hampiee_dev;Username=hampiee;Password=dev_password_change_me
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=change-me-in-dev-must-be-32-chars-long!!
      - Jwt__Issuer=http://localhost:5000
      - Jwt__Audience=http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/Hampiee.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    networks:
      - hampiee-net
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hampiee_dev
      POSTGRES_USER: hampiee
      POSTGRES_PASSWORD: dev_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hampiee -d hampiee_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hampiee-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hampiee-net

  # ── Meilisearch (fast product search) ────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=dev_master_key_change_me
      - MEILI_ENV=development
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - hampiee-net

  # ── Adminer (DB UI for dev) ───────────────────────────────────────────────
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hampiee-net

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  hampiee-net:
    driver: bridge
