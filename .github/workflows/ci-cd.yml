name: Hampiee CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  REGISTRY: gcr.io
  IMAGE_NAME: ${{ secrets.GCP_PROJECT_ID }}/hampiee-api

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend Tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    name: Backend Build & Test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hampiee_test
          POSTGRES_USER: hampiee
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore Hampiee.sln

      - name: Build
        run: dotnet build Hampiee.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/Hampiee.UnitTests/Hampiee.UnitTests.csproj \
            --no-build --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect "XPlat Code Coverage"

      - name: Run Integration Tests
        run: |
          dotnet test tests/Hampiee.IntegrationTests/Hampiee.IntegrationTests.csproj \
            --no-build --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=hampiee_test;Username=hampiee;Password=test_password

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend Tests
  # ─────────────────────────────────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend Build & Test
    defaults:
      run:
        working-directory: src/Hampiee.Web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Hampiee.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Storefront
        run: npm run test:storefront -- --watch=false --browsers=ChromeHeadless

      - name: Test Admin
        run: npm run test:admin -- --watch=false --browsers=ChromeHeadless

      - name: Build Storefront (Production)
        run: npm run build:storefront -- --configuration production

      - name: Build Admin (Production)
        run: npm run build:admin -- --configuration production

  # ─────────────────────────────────────────────────────────────────────────
  # Docker Build & Push (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --cache-from ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to Cloud Run (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to GCP Cloud Run
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: hampiee-api
          region: asia-southeast1
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Production
          secrets: |
            ConnectionStrings__DefaultConnection=hampiee-db-connection:latest
            Jwt__Key=hampiee-jwt-key:latest
            PayHere__MerchantId=payhere-merchant-id:latest
            PayHere__MerchantSecret=payhere-merchant-secret:latest
            SendGrid__ApiKey=sendgrid-api-key:latest
